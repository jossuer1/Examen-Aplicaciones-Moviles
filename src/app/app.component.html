<ion-app>
  <ion-router-outlet
    [attr.aria-hidden]="mostrandoSplash() ? 'true' : null"
    [attr.inert]="mostrandoSplash() ? '' : null"
  ></ion-router-outlet>
  @if (mostrandoSplash()) {
    <section class="launch-screen" role="status" aria-label="Iniciando UrbanInspect">
      <div class="launch-brand">
        <img src="assets/brand/urbaninspect-logo.svg" alt="" width="104" height="104" />
        <h1>UrbanInspect</h1>
        <p class="launch-city">GESTIÓN URBANA · QUITO</p>
        <div class="launch-line" aria-hidden="true"><span></span></div>
      </div>
      <p class="launch-caption">Inspección y seguimiento<br /><span>de infraestructura urbana</span></p>
    </section>
  }
</ion-app>
